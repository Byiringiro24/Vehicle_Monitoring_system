services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet_management
      POSTGRES_USER: artic_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    # Bind to localhost only — not reachable from the internet
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artic_user -d fleet_management']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Bind to localhost only — not reachable from the internet
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '4000:4000'   # REST API + Socket.IO
      - '1883:1883'   # MQTT (ESP32 devices connect here)
    volumes:
      - uploads_data:/app/uploads   # ← persist uploaded documents across rebuilds
    environment:
      DATABASE_URL: "postgresql://artic_user:${POSTGRES_PASSWORD}@postgres:5432/fleet_management?schema=public&sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      PORT: "4000"
      MQTT_PORT: "1883"
      AEDES_PORT: "1884"
      MQTT_HOST: "127.0.0.1"
      MQTT_INTERNAL_PORT: "1884"
      NODE_ENV: "production"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      # SMTP — email delivery
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      APP_URL: "${APP_URL}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL}"
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL}"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:    # persists uploaded files (documents, photos) across container rebuilds
